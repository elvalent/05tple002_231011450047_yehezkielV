<!DOCTYPE html>
<html>
<head>
    <title>Switch Case</title>
</head>
<body>

<h2>Pilihan Menu</h2>

<script>
    let menu = 2;

    switch (menu) {
        case 1:
            document.write("Anda memilih Nasi Goreng");
            break;

        case 2:
            document.write("Anda memilih Mie Ayam");
            break;

        case 3:
            document.write("Anda memilih Bakso");
            break;

        default:
            document.write("Menu tidak tersedia");
    }
</script>

</body>
</html>
