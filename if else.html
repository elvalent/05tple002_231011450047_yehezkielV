<!DOCTYPE html>
<html>
<head>
    <title>IF ELSE</title>
</head>
<body>

<h2>Cek Umur Membuat SIM</h2>

<script>
    let umur = 20;

    if (umur >= 18) {
        document.write("Boleh membuat SIM");
    } else {
        document.write("Belum cukup umur untuk membuat SIM");
    }
</script>

</body>
</html>
